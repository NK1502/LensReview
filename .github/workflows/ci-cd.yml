name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reviewlens-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Check Python syntax
        run: python -m compileall -q app

      - name: Start application and verify dashboard
        run: |
          HOST=127.0.0.1 PORT=8000 python -m app.main &
          echo $! > server.pid

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/dashboard > /tmp/dashboard.json; then
              break
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:8000/ | grep -q "ReviewLens"
          python -c "import json; json.load(open('/tmp/dashboard.json'))"
          kill "$(cat server.pid)"

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://lensreview.onrender.com

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not configured in GitHub Actions secrets."
            exit 1
          fi

          curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"
