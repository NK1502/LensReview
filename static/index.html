<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>ReviewLens — Customer insights</title>
  <style>
    :root {
      --page: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --text: #172033;
      --muted: #697386;
      --border: #e7eaf0;
      --accent: #5b5bd6;
      --accent-dark: #4949b8;
      --accent-soft: #efefff;
      --positive: #16835b;
      --positive-soft: #e9f7ef;
      --neutral: #a36a11;
      --neutral-soft: #fff4d6;
      --negative: #c84a4a;
      --negative-soft: #fdeeee;
      --shadow: 0 12px 32px rgba(31, 41, 55, 0.07);
      --radius: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11131a;
        --surface: #191c24;
        --surface-soft: #20242e;
        --text: #edf0f7;
        --muted: #a6adba;
        --border: #2b3040;
        --accent: #8b8bff;
        --accent-dark: #aaaaff;
        --accent-soft: #292943;
        --positive: #67cf9e;
        --positive-soft: #1d362b;
        --neutral: #ecc66d;
        --neutral-soft: #3a3322;
        --negative: #f58d8d;
        --negative-soft: #402425;
        --shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 15% 0%, rgba(91, 91, 214, 0.07), transparent 24rem),
        var(--page);
      color: var(--text);
      font: 14px/1.5 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .shell {
      width: min(1240px, calc(100% - 40px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-mark {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #6868df, #4848ba);
      color: white;
      box-shadow: 0 8px 18px rgba(91, 91, 214, 0.22);
      font-size: 18px;
      font-weight: 800;
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .upload {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .file-wrap {
      position: relative;
      max-width: 190px;
    }

    input[type="file"] {
      width: 190px;
      height: 40px;
      overflow: hidden;
      color: transparent;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button {
      height: 40px;
      margin-right: 8px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
      color: var(--text);
      font-weight: 650;
      cursor: pointer;
    }

    .primary {
      height: 40px;
      padding: 0 16px;
      border: 0;
      border-radius: 9px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      box-shadow: 0 7px 16px rgba(91, 91, 214, 0.18);
      transition: 160ms ease;
    }

    .primary:hover { background: var(--accent-dark); transform: translateY(-1px); }
    .primary:active { transform: translateY(0); }
    .primary:disabled { cursor: wait; opacity: 0.65; transform: none; }

    #err {
      min-height: 20px;
      margin: -10px 0 12px;
      color: var(--negative);
      font-weight: 650;
    }

    .welcome {
      display: grid;
      min-height: 520px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .welcome-inner { max-width: 430px; padding: 36px 24px; }

    .welcome-icon {
      display: grid;
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      place-items: center;
      border-radius: 20px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 28px;
    }

    .welcome h2 {
      margin: 0 0 8px;
      font-size: 22px;
      letter-spacing: -0.02em;
    }

    .welcome p {
      margin: 0;
      color: var(--muted);
    }

    #app[hidden], [hidden] { display: none !important; }

    .status-row {
      display: flex;
      align-items: center;
      min-height: 32px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-row::before {
      content: "";
      width: 7px;
      height: 7px;
      margin-right: 8px;
      border-radius: 50%;
      background: var(--positive);
      box-shadow: 0 0 0 4px var(--positive-soft);
    }

    .status-row.loading::before {
      background: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse { 50% { opacity: 0.35; } }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .metric {
      min-height: 112px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 5px 18px rgba(31, 41, 55, 0.04);
    }

    .metric-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .metric-icon {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 8px;
      background: var(--surface-soft);
      font-size: 13px;
      letter-spacing: 0;
    }

    .metric-value {
      margin-top: 12px;
      font-size: 30px;
      font-weight: 750;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .metric-sub {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .metric.positive .metric-icon { background: var(--positive-soft); color: var(--positive); }
    .metric.negative .metric-icon { background: var(--negative-soft); color: var(--negative); }
    .metric.neutral .metric-icon { background: var(--neutral-soft); color: var(--neutral); }

    .insights {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 5px 18px rgba(31, 41, 55, 0.04);
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 18px 12px;
      border-bottom: 1px solid var(--border);
    }

    .panel-heading h2 {
      margin: 0;
      font-size: 14px;
    }

    .heading-icon {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 9px;
      background: var(--surface-soft);
    }

    .theme-list {
      min-height: 134px;
      margin: 0;
      padding: 10px 18px 14px;
      list-style: none;
      counter-reset: themes;
    }

    .theme-list li {
      display: flex;
      align-items: center;
      min-height: 38px;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      counter-increment: themes;
    }

    .theme-list li:last-child { border-bottom: 0; }

    .theme-list li::before {
      content: counter(themes);
      display: grid;
      width: 22px;
      height: 22px;
      margin-right: 10px;
      flex: 0 0 22px;
      place-items: center;
      border-radius: 7px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .theme-list .empty {
      color: var(--muted);
    }

    .table-panel { overflow: hidden; }

    .table-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .table-toolbar h2 {
      margin: 0 auto 0 0;
      font-size: 14px;
    }

    select {
      height: 36px;
      max-width: 170px;
      padding: 0 32px 0 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
      color: var(--text);
      outline: none;
    }

    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .check-wrap {
      display: flex;
      height: 36px;
      align-items: center;
      gap: 7px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--muted);
      white-space: nowrap;
    }

    .check-wrap input {
      accent-color: var(--accent);
    }

    .table-scroll { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 870px;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    tbody tr { transition: background 120ms ease; }
    tbody tr:hover { background: var(--surface-soft); }
    tbody tr:last-child td { border-bottom: 0; }

    .id-cell {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }

    .rating {
      white-space: nowrap;
      color: #c58b20;
      font-weight: 750;
    }

    .review-text {
      max-width: 340px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .summary-text {
      max-width: 340px;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .sentiment {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 750;
      text-transform: capitalize;
    }

    .sentiment::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .sentiment-positive { background: var(--positive-soft); color: var(--positive); }
    .sentiment-neutral { background: var(--neutral-soft); color: var(--neutral); }
    .sentiment-negative { background: var(--negative-soft); color: var(--negative); }

    .muted { color: var(--muted); }

    .tag {
      display: inline-block;
      margin: 0 4px 4px 0;
      padding: 3px 7px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
    }

    .warn {
      margin-top: 5px;
      color: var(--negative);
      font-size: 11px;
      font-weight: 700;
    }

    .reply-button {
      height: 32px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
    }

    .reply-button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .reply-button:disabled { cursor: wait; opacity: 0.65; }

    .reply {
      max-width: 260px;
      margin-top: 7px;
      padding: 8px 9px;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--text);
      font-size: 12px;
      white-space: pre-wrap;
    }

    .empty-row td {
      height: 160px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 900px) {
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 680px) {
      .shell { width: min(100% - 24px, 1240px); padding-top: 16px; }
      .topbar { align-items: flex-start; }
      .brand p { display: none; }
      .upload { align-items: stretch; }
      .file-wrap, input[type="file"] { width: 46px; }
      input[type="file"] { color: transparent; }
      .primary { padding: 0 12px; }
      .metrics { grid-template-columns: 1fr 1fr; }
      .metric { min-height: 100px; }
      .insights { grid-template-columns: 1fr; }
      .table-toolbar { align-items: stretch; flex-wrap: wrap; }
      .table-toolbar h2 { width: 100%; }
      select { flex: 1; max-width: none; }
      .check-wrap { flex: 1 1 140px; }
    }

    @media (max-width: 420px) {
      .metrics { grid-template-columns: 1fr; }
      .metric { min-height: 92px; }
      .topbar { gap: 8px; }
      .brand-mark { width: 36px; height: 36px; }
      .brand h1 { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">RL</div>
        <div>
          <h1>ReviewLens</h1>
          <p>Customer review intelligence</p>
        </div>
      </div>
      <div class="upload">
        <div class="file-wrap">
          <input type="file" id="file" accept=".csv" aria-label="Choose a CSV file">
        </div>
        <button class="primary" id="go">Analyse reviews</button>
      </div>
    </header>

    <p id="err" role="alert"></p>

    <section class="welcome" id="welcome">
      <div class="welcome-inner">
        <div class="welcome-icon" aria-hidden="true">✦</div>
        <h2>Turn reviews into clear insights</h2>
        <p id="welcome-status">Upload a CSV file to analyse sentiment, themes, ratings, and replies.</p>
      </div>
    </section>

    <section id="app" hidden>
      <div class="status-row" id="status"></div>

      <div class="metrics" id="cards"></div>

      <div class="insights">
        <section class="panel">
          <div class="panel-heading">
            <h2>Top complaints</h2>
            <span class="heading-icon" aria-hidden="true">↓</span>
          </div>
          <ul class="theme-list" id="complaints"></ul>
        </section>
        <section class="panel">
          <div class="panel-heading">
            <h2>Top praises</h2>
            <span class="heading-icon" aria-hidden="true">↑</span>
          </div>
          <ul class="theme-list" id="praises"></ul>
        </section>
      </div>

      <section class="panel table-panel">
        <div class="table-toolbar">
          <h2>Reviews</h2>
          <select id="fp" aria-label="Filter by product">
            <option value="">All products</option>
          </select>
          <select id="fs" aria-label="Filter by sentiment">
            <option value="">All sentiments</option>
            <option>positive</option>
            <option>neutral</option>
            <option>negative</option>
          </select>
          <select id="ft" aria-label="Filter by topic">
            <option value="">All topics</option>
          </select>
          <label class="check-wrap">
            <input type="checkbox" id="fr">
            Needs reply
          </label>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Product</th>
                <th>Rating</th>
                <th>Review</th>
                <th>Sentiment</th>
                <th>Topics</th>
                <th>Reply</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const esc = value => {
      const div = document.createElement("div");
      div.textContent = value ?? "";
      return div.innerHTML;
    };

    let DATA = null;

    async function api(url, options) {
      const response = await fetch(url, options);
      const json = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(json.detail || response.statusText);
      return json;
    }

    $("go").onclick = async () => {
      const file = $("file").files[0];
      if (!file) {
        $("err").textContent = "Choose a CSV file first.";
        return;
      }

      $("err").textContent = "";
      $("go").disabled = true;
      $("go").textContent = "Analysing…";
      $("welcome-status").textContent = "Analysing your reviews. This may take a moment.";
      $("status").textContent = "Analysing reviews…";
      $("status").classList.add("loading");

      try {
        DATA = await api("/api/upload", {
          method: "POST",
          headers: { "Content-Type": "text/csv" },
          body: file
        });
        render();
      } catch (error) {
        $("err").textContent = error.message;
        $("status").textContent = "Analysis could not be completed.";
      } finally {
        $("go").disabled = false;
        $("go").textContent = "Analyse reviews";
        $("status").classList.remove("loading");
      }
    };

    function render() {
      const summary = DATA.summary;
      const log = DATA.log;
      $("welcome").hidden = true;
      $("app").hidden = false;
      $("status").textContent = log
        ? `${log.ai_calls} AI calls · ${log.cache_hits} served from cache · ${log.seconds}s`
        : "Dashboard ready";

      const skipped = summary.empty + summary.duplicates + summary.failed;
      const cards = [
        { value: summary.analysed, label: "Reviews analysed", sub: `${summary.total_rows} total rows`, icon: "▦" },
        { value: summary.positive_pct + "%", label: "Positive", sub: "of analysed reviews", icon: "↑", tone: "positive" },
        { value: summary.neutral_pct + "%", label: "Neutral", sub: "of analysed reviews", icon: "•", tone: "neutral" },
        { value: summary.negative_pct + "%", label: "Negative", sub: `${summary.needs_reply} need a reply`, icon: "↓", tone: "negative" }
      ];

      $("cards").innerHTML = cards.map(card => `
        <article class="metric ${card.tone || ""}">
          <div class="metric-head">
            <span>${esc(card.label)}</span>
            <span class="metric-icon">${esc(card.icon)}</span>
          </div>
          <div class="metric-value">${esc(card.value)}</div>
          <div class="metric-sub">${esc(card.sub)}</div>
        </article>
      `).join("");

      for (const key of ["complaints", "praises"]) {
        const items = (DATA.themes || {})[key] || [];
        $(key).innerHTML = items.length
          ? items.map(item => `<li>${esc(item)}</li>`).join("")
          : '<li class="empty">Not enough data</li>';
      }

      fill("fp", [...new Set(DATA.reviews.map(review => review.product))].sort());
      fill("ft", [...new Set(DATA.reviews.flatMap(review => review.analysis ? review.analysis.topics : []))].sort());
      table();
    }

    function fill(id, values) {
      const select = $(id);
      const keep = select.value;
      select.length = 1;
      values.forEach(value => select.add(new Option(value, value)));
      select.value = [...select.options].some(option => option.value === keep) ? keep : "";
    }

    function table() {
      const product = $("fp").value;
      const sentiment = $("fs").value;
      const topic = $("ft").value;
      const needsReply = $("fr").checked;

      const filtered = DATA.reviews.filter(review =>
        (!product || review.product === product) &&
        (!sentiment || review.analysis?.sentiment === sentiment) &&
        (!topic || review.analysis?.topics.includes(topic)) &&
        (!needsReply || (review.analysis?.needs_reply && review.status === "ok"))
      );

      if (!filtered.length) {
        $("rows").innerHTML = '<tr class="empty-row"><td colspan="7">No reviews match these filters.</td></tr>';
        return;
      }

      $("rows").innerHTML = filtered.map(review => {
        const analysis = review.analysis;
        const flags = [
          review.status !== "ok"
            ? `<div class="warn">${esc(review.status.replace("_", " "))}${review.duplicate_of ? " of " + esc(review.duplicate_of) : ""}</div>`
            : "",
          review.injection_attempt ? '<div class="warn">⚠ Prompt-injection attempt in text</div>' : "",
          review.mismatch ? '<div class="warn">⚠ Rating disagrees with text</div>' : ""
        ].join("");

        const sentimentLabel = analysis
          ? `<span class="sentiment sentiment-${esc(analysis.sentiment)}">${esc(analysis.sentiment)}</span>`
          : '<span class="muted">—</span>';

        const topics = analysis
          ? analysis.topics.map(item => `<span class="tag">${esc(item)}</span>`).join("")
          : "";

        const reply = analysis && analysis.needs_reply && review.status === "ok"
          ? `<button class="reply-button" data-id="${esc(review.review_id)}">Suggest reply</button>
             <div class="reply" id="rp-${esc(review.review_id)}" hidden></div>`
          : '<span class="muted">—</span>';

        return `
          <tr>
            <td class="id-cell">${esc(review.review_id)}</td>
            <td>${esc(review.product)}</td>
            <td class="rating">${review.rating ? "★ " + esc(review.rating) : "—"}</td>
            <td>
              <div class="review-text">${esc(review.text) || "<span class=\"muted\"><i>(empty)</i></span>"}</div>
              ${analysis ? `<div class="summary-text">${esc(analysis.summary)}</div>` : ""}
              ${flags}
            </td>
            <td>${sentimentLabel}</td>
            <td>${topics}</td>
            <td>${reply}</td>
          </tr>
        `;
      }).join("");
    }

    ["fp", "fs", "ft", "fr"].forEach(id => $(id).onchange = table);

    $("rows").onclick = async event => {
      const button = event.target.closest("button[data-id]");
      if (!button) return;

      const box = $("rp-" + button.dataset.id);
      button.disabled = true;
      button.textContent = "Writing…";

      try {
        const result = await api("/api/reply", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ review_id: button.dataset.id })
        });
        box.textContent = result.reply;
      } catch (error) {
        box.textContent = "Error: " + error.message;
      }

      box.hidden = false;
      button.remove();
    };

    api("/api/dashboard")
      .then(dashboard => {
        if (dashboard.reviews.length) {
          DATA = dashboard;
          render();
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
